name: Release

# Cut a downloadable build by pushing a version tag, e.g.:
#   git tag v1.0.1 && git push origin v1.0.1
# A macOS runner builds the Release configuration, packages Peck.app into a zip, and
# attaches it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    # Pinned to match CI so a green CI build predicts a green release build.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: >
          xcodebuild -project Peck.xcodeproj -scheme Peck -configuration Release
          -derivedDataPath build -destination 'platform=macOS' build

      - name: Test
        run: xcodebuild -project Peck.xcodeproj -scheme Peck -destination 'platform=macOS' test

      - name: Package Peck.app into a zip
        run: |
          APP="build/Build/Products/Release/Peck.app"
          test -d "$APP" || { echo "App not found at $APP" >&2; exit 1; }
          # ditto (not `zip`) preserves the code signature and the bundle's internal
          # symlinks; a plain zip can corrupt the signature and break launch.
          ditto -c -k --keepParent "$APP" "Peck.zip"
          echo "SHA-256:"; shasum -a 256 Peck.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Peck.zip \
            --title "Peck $GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" Peck.zip --clobber
