name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    # Pinned (not macos-latest) so CI and the release workflow compile with the same
    # toolchain — a green build here then reliably predicts a green release build.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (Debug)
        run: xcodebuild -project Peck.xcodeproj -scheme Peck -configuration Debug -destination 'platform=macOS' build

      # Build the Release configuration the shipped app uses (whole-module optimization,
      # assertions off) into a known location so it can be packaged below.
      - name: Build (Release)
        run: >
          xcodebuild -project Peck.xcodeproj -scheme Peck -configuration Release
          -derivedDataPath build -destination 'platform=macOS' build

      # PeckTests is a host-less logic bundle: no app launch, no TCC prompts,
      # and the KeyMapper tests skip if the runner has no resolvable layout.
      - name: Test
        run: xcodebuild -project Peck.xcodeproj -scheme Peck -destination 'platform=macOS' test

      - name: Fallback swiftc build
        run: ./Scripts/build-no-xcode.sh

      # Package the Release .app so it can be downloaded straight from this run's
      # Artifacts, without needing a tag/Release. ditto (not `zip`) preserves the
      # code signature and the bundle's internal symlinks.
      - name: Package Peck.app
        run: |
          APP="build/Build/Products/Release/Peck.app"
          test -d "$APP" || { echo "App not found at $APP" >&2; exit 1; }
          ditto -c -k --keepParent "$APP" "Peck.zip"
          echo "SHA-256:"; shasum -a 256 Peck.zip

      - name: Upload Peck.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peck-app-zip
          path: Peck.zip
          if-no-files-found: error
